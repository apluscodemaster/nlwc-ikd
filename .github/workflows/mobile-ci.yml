# Mobile app CI (React Native / Expo in mobile/).
# Runs only when the app or the web source it imports changes. The web CI
# (ci.yml) is unchanged.
name: Mobile CI

on:
  push:
    branches: [mobile-dev]
    paths: ["mobile/**", "src/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**", "src/**", ".github/workflows/mobile-ci.yml"]
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint, shared-code guard & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Shared-code guard
        run: npm run check:shared

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Proves the app actually bundles (including the shared web modules).
      - name: Bundle (Android)
        run: npx expo export --platform android --output-dir dist
