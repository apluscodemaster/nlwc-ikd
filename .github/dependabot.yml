# Weekly dependency update PRs. Minor/patch updates are grouped into one PR
# per ecosystem so they're quick to review; CI runs on each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Expo SDK upgrades move many packages together (npx expo install --fix);
    # never let Dependabot bump a major version on its own.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
